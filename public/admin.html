<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · ROTHSHILD Order of Light</title><link rel="stylesheet" href="/style.css"><style>
.admin-wrap{max-width:1100px;margin:3rem auto;padding:0 1rem}.admin-box{border:1px solid #73582e;background:#100d09;padding:1.2rem;color:#e8dcc4}.admin-toolbar{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0}.admin-toolbar input,.admin-toolbar select{background:#090807;color:#eee;border:1px solid #73582e;padding:.7rem}.member-row{border-top:1px solid #49391f;padding:1rem 0;display:grid;gap:.65rem}.member-actions{display:flex;gap:.5rem;flex-wrap:wrap}.member-actions select,.member-actions button{padding:.55rem;background:#15110b;color:#eadfc9;border:1px solid #876b3c}.member-actions button{cursor:pointer}.note{color:#c8b68f}
</style><style id="rothshild-translate-style">
#rothshild-translate{display:flex;align-items:center;gap:5px;margin-left:auto;margin-right:10px;color:#d6b66d;font:12px Arial,sans-serif;white-space:nowrap}
#rothshild-translate .goog-te-gadget{font-size:0!important;color:transparent!important}
#rothshild-translate .goog-te-combo{max-width:118px;width:118px;margin:0!important;padding:6px 5px;background:#100e0a;color:#e9ce91;border:1px solid #8b713e;border-radius:5px;font-size:12px}
.goog-te-banner-frame,.skiptranslate iframe{display:none!important}body{top:0!important}.goog-te-gadget span{display:none!important}
@media(max-width:480px){#rothshild-translate{margin-right:6px}#rothshild-translate .goog-te-combo{width:94px;max-width:94px;font-size:11px}}
</style></head><body><header><a class="brand" href="/">♜ ROTHSHILD<small>ORDER OF LIGHT</small></a><nav><a href="/">Home</a><a href="/forum.html">Forum</a><a href="/profil.html">Profil</a></nav><div id="rothshild-translate" aria-label="Website language"><span>🌐</span><div id="google_translate_element"></div></div></header><main class="admin-wrap"><p class="eyebrow">RESTRICTED AREA</p><h1>Mitgliederverwaltung</h1><p>Nur serverseitig autorisierte Administratoren können diese Übersicht laden oder Mitgliedschaften ändern.</p><section class="admin-box"><div class="admin-toolbar"><input id="filter" type="search" placeholder="Name oder E-Mail filtern"><button class="gold" id="refresh">Mitglieder laden</button></div><p class="note" id="status" role="status">Bitte anmelden und Mitgliederliste laden.</p><div id="members"></div></section></main><footer>ROTHSHILD · ORDER OF LIGHT</footer>
<script>
const $=id=>document.getElementById(id);let records=[];
async function api(url,opts={}){const r=await fetch('/api'+url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Anfrage fehlgeschlagen');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const term=$('filter').value.trim().toLowerCase();const list=records.filter(u=>(u.display_name+' '+u.email+' '+u.role+' '+u.status).toLowerCase().includes(term));$('members').innerHTML=list.map(u=>`<article class="member-row" data-id="${esc(u.id)}"><b>${esc(u.display_name)} · ${esc(u.email)}</b><small>Current: ${esc(u.role)} / ${esc(u.status)}</small><div class="member-actions"><select data-role><option value="applicant">Applicant</option><option value="member">Member</option><option value="mentor">Mentor</option><option value="moderator">Moderator</option><option value="admin">Admin</option></select><select data-status><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="suspended">Suspended</option></select><button data-save>Änderung speichern</button></div></article>`).join('')||'<p>Keine passenden Konten.</p>';list.forEach(u=>{const el=$('members').querySelector('[data-id="'+CSS.escape(u.id)+'"]');el.querySelector('[data-role]').value=u.role;el.querySelector('[data-status]').value=u.status;el.querySelector('[data-save]').onclick=async()=>{const role=el.querySelector('[data-role]').value,status=el.querySelector('[data-status]').value;try{await api('/admin/users/'+encodeURIComponent(u.id),{method:'PATCH',body:JSON.stringify({role,status})});$('status').textContent='Mitglied aktualisiert.';await load()}catch(e){$('status').textContent=e.message}}})}
async function load(){ $('status').textContent='Lade …';try{records=await api('/admin/users');$('status').textContent=records.length+' Konten geladen.';render()}catch(e){$('status').textContent=e.message;$('members').innerHTML=''}}
$('refresh').onclick=load;$('filter').oninput=render;
</script><script src="/translator.js?v=20261106-en"></script></body></html>
